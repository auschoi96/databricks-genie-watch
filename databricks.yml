bundle:
  name: "genie-watch"
  databricks_cli_version: ">= 0.297.2"

variables:
  app_name:
    description: "Databricks App name (must be unique in your workspace)"
    default: "genie-watch"
  warehouse_id:
    description: "SQL Warehouse ID for system.* queries"

# Bundle-managed resources (currently only the executive overview dashboard).
# The Databricks App itself is created via `databricks apps create` from
# deploy.sh — it isn't declared here so the same script can deploy code-only
# updates without churning the bundle state.
sync:
  include:
    - dashboards
    - dashboards/**
  exclude:
    - backend/**
    - frontend/**
    - tests/**

resources:
  dashboards:
    genie_spaces_overview:
      display_name: "GenieWatch — Genie Spaces Overview"
      file_path: ./dashboards/genie_spaces_overview.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${workspace.resource_path}/dashboards
      embed_credentials: true

targets:
  dev:
    mode: development
    default: true
  app:
    # `mode: development` gives per-deployer Terraform state.
    # `presets.name_prefix: ""` keeps the dashboard display_name clean
    # (without the [dev <user>] prefix that mode: development normally adds).
    mode: development
    presets:
      name_prefix: ""
